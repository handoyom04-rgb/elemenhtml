<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        /* selector Elemen - semua tag <h2> */
            h2{
                color: #2e86c1;
                border-bottom: 2px solid #aed6f1;
            }

        /* selector Class - elemen yang punya class='haglight' */
        .highlight {
            background-color: yellow;
            font-weight: bold;
        }
        
        /* selector ID - elemen dengan id='hero' */
        #hero {
            background-color: #1a5276;
            color: white;
            padding: 40px;
        }

        /* Gruoping - terapan gaya yang sama ke h1,h4,h3 */
        h1,h4,h3 {
            font-family: 'Georgia', serif;
            color: #190dbe;
        }

        /* pseudo-class - tautan saat di-hover */
        a:hover {
            color: red;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>SELEMET DATANG</h1>
    <h1>REKAYASA PERANGKAT LUNAK</h1>

    <a href="#">X RPL 2</a>

    <p class="highlight">Andi sukirno</p>

    <p id="hero">Bayu Kusuma</p>
</body>
</html>
